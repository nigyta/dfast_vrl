# This docker-compose file is only for development use
services:

    app:
        # Use the locally-built slim image (built from ./Dockerfile). Compose reuses
        # it if present; run `docker compose build` (or VS Code "Rebuild Container")
        # to rebuild after Dockerfile changes.
        image: dfast_vrl:slim
        # Image is linux/amd64 (FROM --platform in the Dockerfile); run it as such
        # on arm64 hosts (Apple Silicon) via emulation.
        platform: linux/amd64
        build:
            context: .
        command: tail -f /dev/null
        volumes:
            - .:/dfast_vrl
            - ./dev:/data
            - ../vadr_models:/vadr_models
        environment:
            - TZ=Asia/Tokyo            
            - VADRMODELDIR=/vadr_models